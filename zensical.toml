[project]
site_url = "https://kyonru.github.io/gpuparticles/"
site_name = "gpuparticles"
site_description = "GPU particles, collision, and material volumes for LÖVE 11.x"
site_author = "gpuparticles contributors"
repo_url = "https://github.com/Kyonru/gpuparticles"
repo_name = "Kyonru/gpuparticles"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Overview" = "index.md" },
  { "Get started" = [
    { "Quick start" = "getting-started/quick-start.md" },
    { "Choose a system" = "getting-started/choose-a-system.md" },
  ] },
  { "Particle emitters" = [
    { "Configure and render" = "particles/emitter.md" },
    { "Motion and lifetime" = "particles/motion.md" },
    { "Collision" = "particles/collision.md" },
  ] },
  { "Material volumes" = [
    { "Create water" = "volumes/water.md" },
    { "Smoke and reactions" = "volumes/smoke-and-reactions.md" },
    { "Runtime interaction" = "volumes/runtime-interaction.md" },
  ] },
  { "Tools and examples" = [
    { "Particle Studio" = "tools/editor.md" },
    { "Examples and comparison" = "tools/examples.md" },
  ] },
  { "Reference" = [
    { "Emitter API" = "reference/emitter.md" },
    { "Volume API" = "reference/volume.md" },
    { "Limits and performance" = "reference/limits.md" },
  ] },
]

[project.theme]
language = "en"
font = false
features = [
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
toc.permalink = true
